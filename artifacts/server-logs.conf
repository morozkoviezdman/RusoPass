# Log rotation configuration for server logs
# Rotates monthly, keeps 30 days of logs, prevents disk overflow

# System log files
/var/log/alternatives.log
/var/log/apport.log
/var/log/fontconfig.log
/var/log/dpkg.log
/var/log/dist-upgrade
/var/log/alternatives.log.1
/var/log/installer {
    missingok
    rotate 30
    daily
    compress
    delaycompress
    notifempty
    create 0644 root root
    dateext
    dateformat -%Y%m%d
}

/var/log/apt/history.log
/var/log/apt/term.log {
    missingok
    rotate 30
    daily
    compress
    delaycompress
    notifempty
    create 0640 root adm
    dateext
    dateformat -%Y%m%d
}

/var/log/unattended-upgrades/unattended-upgrades.log {
    missingok
    rotate 30
    daily
    compress
    delaycompress
    notifempty
    create 0640 root adm
    dateext
    dateformat -%Y%m%d
}

/var/log/unattended-upgrades/unattended-upgrades-dpkg.log {
    missingok
    rotate 30
    daily
    compress
    delaycompress
    notifempty
    create 0640 root adm
    dateext
    dateformat -%Y%m%d
}

