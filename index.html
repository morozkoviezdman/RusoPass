<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>RusoPass - транслятор раскладки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 700px;
    background: #1e293b;
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  h1 { font-size: 18px; margin-bottom: 6px; }
  .subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 20px;
    text-align: center;
  }
  .fields {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }
  .field {
    width: 100%;
    text-align: center;
    font-size: 22px;
    padding: 16px 18px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #0f172a;
    color: #f1f5f9;
    font-family: monospace;
    letter-spacing: 2px;
    outline: none;
    min-height: 52px;
  }
  .field:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,.25);
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .seg {
    flex: 1;
    display: flex;
    background: #334155;
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
  }
  .seg button {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    cursor: pointer;
    transition: all .15s;
  }
  .seg button.active {
    background: #38bdf8;
    color: #0f172a;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 18px;
    user-select: none;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  .toggle .ball {
    width: 44px;
    height: 26px;
    background: #334155;
    border-radius: 13px;
    position: relative;
    transition: .25s;
  }
  .toggle .ball::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #e2e8f0;
    border-radius: 50%;
    transition: .25s;
  }
  .toggle input:checked + .ball {
    background: #38bdf8;
  }
  .toggle input:checked + .ball::after {
    background: #0f172a;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .actions button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .15s;
  }
  .btn-copy {
    background: #38bdf8;
    color: #0f172a;
  }
  .btn-copy:active {
    background: #0ea5e9;
  }
  .btn-clear {
    background: #334155;
    color: #f1f5f9;
  }
  .msg {
    margin-top: 14px;
    text-align: center;
    font-size: 14px;
    color: #94a3b8;
    min-height: 22px;
    transition: .2s;
  }
  .msg.active { color: #4ade80; }
  .field.out {
    font-family: monospace;
    letter-spacing: 2px;
    font-weight: 700;
  }
  .field.out.aster {
    letter-spacing: 4px;
  }
  .settings-hint {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 20px;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
  }
  .settings-hint h3 {
    color: #f1f5f9;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .settings-hint ol {
    margin-left: 20px;
    color: #94a3b8;
    padding-left: 20px;
  }
  .settings-hint li {
    margin-bottom: 6px;
  }
  .settings-hint .platform {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 8px;
  }
  .settings-hint .platform-ios {
    background: #007aff;
    color: #fff;
  }
  .settings-hint .platform-android {
    background: #3d81f3;
    color: #fff;
  }
</style>
</head>
<body>
<div class="app">
  <h1 class="app-title">RusoPass - транслятор раскладки</h1>
  <p class="subtitle">Русский ↔ Английская раскладка</p>
  
  <div class="row">
    <div class="seg">
      <button data-lang="rus" class="active">Русский → Английский</button>
      <button data-lang="eng">Английский → Русский</button>
    </div>
  </div>
  
  <div class="fields">
    <input class="field" id="input" placeholder="Введите текст...">
    <input class="field out" id="output" readonly>
  </div>
  
  <label class="toggle">
    <input type="checkbox" id="aster" checked>
    <span class="ball"></span>
    Звездочки
  </label>
  
  <div class="actions">
    <button class="btn-copy" id="copyBtn">Скопировать</button>
    <button class="btn-clear" id="clearBtn">Очистить</button>
  </div>
  
  <div class="msg" id="msg"></div>
  
  <div class="settings-hint">
    <h3>📱 Как добавить на свой рабочий экран?</h3>
    <ol>
      <li>
        <span class="platform platform-ios">iOS</span>
        Safari — поделитесь (кнопка Share), выберите «Добавить на домашний экран», дайте имя и нажмите «Добавить».
      </li>
      <li>
        <span class="platform platform-android">Android</span>
        Chrome — меню (3 точки) → «Добавить на экран» → «Добавить».
      </li>
    </ol>
  </div>
</div>

<script>
// Карта раскладок: русский -> английский
var cyr2lat = {
  "й":"q","ц":"w","у":"e","к":"r","е":"t","н":"y","г":"u","ш":"i","щ":"o","з":"p","х":"[","ъ":"]","ё":"e",
  "ф":"a","ы":"s","в":"d","а":"f","п":"g","р":"h","о":"j","л":"k","д":"l","ж":";","э":"'","я":"z",
  "ч":"x","с":"c","м":"v","и":"b","т":"n","ь":"m","б":",","ю":"."," ":"-",
  "Й":"Q","Ц":"W","У":"E","К":"R","Е":"T","Н":"Y","Г":"U","Ш":"I","Щ":"O","З":"P","Х":"[","Ъ":"]","Ё":"E",
  "Ф":"A","Ы":"S","В":"D","А":"F","П":"G","Р":"H","О":"J","Л":"K","Д":"L","Ж":";","Э":"'","Я":"Z",
  "Ч":"X","С":"C","М":"V","И":"B","Т":"N","Ь":"M","Б":",","Ю":"."," ":"-"
};

var lat2cyr = {};
var lat2cyrUp = {};
for (var key in cyr2lat) {
  if (cyr2lat.hasOwnProperty(key)) {
    var val = cyr2lat[key];
    if (key === " ") continue;
    var lowerKey = key.toLowerCase();
    var lowerVal = val.toLowerCase();
    lat2cyr[lowerVal] = lowerKey;
    lat2cyrUp[val] = key;
  }
}

var inputEl = document.getElementById('input');
var outputEl = document.getElementById('output');
var langSeg = document.querySelector('.seg');
var asterChk = document.getElementById('aster');
var copyBtn = document.getElementById('copyBtn');
var clearBtn = document.getElementById('clearBtn');
var msg = document.getElementById('msg');
var lang = 'rus';

langSeg.addEventListener('click', function(e) {
  var btn = e.target;
  while (btn && btn !== document.documentElement) {
    if (btn.dataset && btn.dataset.lang) {
      break;
    }
    btn = btn.parentNode;
  }
  if (!btn || !btn.dataset || !btn.dataset.lang) return;
  // Удаляем active у ВСЕХ кнопок
  var buttons = langSeg.querySelectorAll('button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.remove('active');
  }
  // Добавляем active только к нажатой
  btn.classList.add('active');
  lang = btn.dataset.lang;
  recalc();
});

inputEl.addEventListener('input', recalc);

asterChk.addEventListener('change', recalc);

clearBtn.addEventListener('click', function() {
  inputEl.value = '';
  outputEl.value = '';
  msg.textContent = '';
  inputEl.focus();
});

copyBtn.addEventListener('click', function() {
  var outVal = outputEl.value;
  if (!outVal) {
    msg.textContent = 'Нет данных для копирования';
    msg.className = 'msg';
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(outVal).then(function() {
      showMsg('Скопировано в буфер', true);
      clearFields();
    }).catch(function() {
      fallbackCopy(outVal);
    });
  } else {
    fallbackCopy(outVal);
  }
});

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    msg.textContent = 'Скопировано (ручной режим)';
    msg.className = 'msg active';
  } catch (e) {
    msg.textContent = 'Ошибка копирования';
    msg.className = 'msg';
  }
  document.body.removeChild(ta);
  setTimeout(function() { msg.className = 'msg'; }, 1500);
}

function showMsg(text, ok) {
  msg.textContent = text;
  msg.className = 'msg' + (ok ? ' active' : '');
  setTimeout(function() { msg.className = 'msg'; }, 1500);
}

function clearFields() {
  inputEl.value = '';
  outputEl.value = '';
  msg.textContent = '';
  inputEl.focus();
}

function recalc() {
  var text = inputEl.value;
  var transformed = transform(text, lang);
  var display = asterChk.checked ? '*'.repeat(transformed.length) : transformed;
  outputEl.value = display;
  if (asterChk.checked) {
    outputEl.classList.add('aster');
  } else {
    outputEl.classList.remove('aster');
  }
}

function transformChar(ch, lang) {
  if (lang === 'rus') {
    if (ch in cyr2lat) {
      return cyr2lat[ch];
    }
    if (ch.toLowerCase() in lat2cyr) {
      return lat2cyr[ch.toLowerCase()];
    }
    return ch;
  } else {
    if (ch in lat2cyrUp) {
      return lat2cyrUp[ch];
    }
    if (ch.toLowerCase() in lat2cyr) {
      return lat2cyr[ch.toLowerCase()];
    }
    return ch;
  }
}

function transform(text, lang) {
  return Array.prototype.map.call(text, function(ch) {
    return transformChar(ch, lang);
  }).join('');
}

recalc();
</script>
</body>
</html>
